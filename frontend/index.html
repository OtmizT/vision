<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisiON</title>
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!--
    Anti-FOUC. Aplica o tema salvo ANTES da primeira pintura.
    Sem isto o data-theme fica no "dark" fixo deste arquivo até o onMounted do
    App.vue rodar, e quem usa o tema claro vê um flash escuro a cada carga.
    Inline e sem defer de propósito: precisa executar antes do CSS.
  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) { /* localStorage bloqueado: segue no padrão do atributo */ }
    })();
  </script>

  <!--
    A fonte (Geist) é auto-hospedada e entra pelo bundle, em src/main.ts. Não há
    mais <link> para o Google: além da dependência externa no caminho de
    carregamento, cada visita mandava o IP do usuário para um terceiro sem
    necessidade nenhuma.
  -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
